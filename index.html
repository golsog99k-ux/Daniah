<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danilah Elite v5.0</title>
    <style>
        body {
            background:#0a0a12;
            color:#fff;
            font-family:Arial,sans-serif;
            padding:15px;
            margin:0;
            text-align:center;
            touch-action:manipulation;
            -webkit-tap-highlight-color:transparent;
        }
        h1 { color:#a78bfa; font-size:26px; margin:10px 0; }
        .page { display:none; }
        .page.on { display:block; }
        .box {
            background:#1a1a28;
            border-radius:14px;
            padding:16px;
            margin:10px 0;
        }
        button {
            display:block;
            width:100%;
            padding:14px;
            margin:8px 0;
            font-size:16px;
            font-weight:bold;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }
        .bp { background:#7c3aed; color:#fff; }
        .bo { background:transparent; border:2px solid #8b5cf6; color:#8b5cf6; }
        .bg { background:#f59e0b; color:#000; }
        .br { background:#ef4444; color:#fff; }
        .bb { background:#06b6d4; color:#000; }
        input {
            display:block;
            width:100%;
            padding:13px;
            margin:6px 0;
            background:#111;
            border:1px solid #333;
            color:#fff;
            font-size:16px;
            border-radius:8px;
            box-sizing:border-box;
        }
        .sm { font-size:12px; color:#999; }
        .er { color:#ef4444; }
        .ok { color:#22c55e; }
        .badge {
            display:inline-block;
            padding:3px 8px;
            border-radius:12px;
            font-size:11px;
            margin:2px;
        }
        .bv { background:rgba(245,158,11,0.2); color:#f59e0b; }
        .bprem { background:rgba(6,182,212,0.2); color:#06b6d4; }
    </style>
</head>
<body>

<!-- ПРИВЕТСТВИЕ -->
<div class="page on" id="welcome">
    <h1>DANILAH</h1>
    <p style="font-size:60px;">🔐</p>
    <p>Добро пожаловать</p>
    <button class="bp" onclick="show('choice')">🚀 Начать</button>
</div>

<!-- ВЫБОР ВХОДА -->
<div class="page" id="choice">
    <h1>DANILAH</h1>
    <p>Выберите способ входа</p>
    <button class="bp" onclick="show('phonePage')">📱 По номеру телефона</button>
    <p class="sm">Быстрый вход</p>
    <button class="bo" onclick="show('codePage')">🔐 По коду</button>
    <p class="sm">Займет больше времени</p>
</div>

<!-- ВХОД ПО ТЕЛЕФОНУ -->
<div class="page" id="phonePage">
    <h1>DANILAH</h1>
    <div class="box">
        <input type="tel" id="phone" placeholder="+7 999 123-45-67">
        <button class="bp" onclick="getSMS()">Получить код</button>
        <div id="smsArea" style="display:none;">
            <input type="text" id="smsCode" placeholder="Код из SMS">
            <button class="bp" onclick="checkSMS()">Подтвердить</button>
        </div>
        <p class="ok" id="phoneMsg"></p>
    </div>
    <button class="bo" onclick="show('choice')">← Назад</button>
</div>

<!-- ВХОД ПО КОДУ -->
<div class="page" id="codePage">
    <h1>DANILAH</h1>
    <div class="box">
        <input type="text" id="loginUser" placeholder="@Username">
        <input type="password" id="loginPass" placeholder="Код-пароль">
        <button class="bp" onclick="login()">Войти</button>
        <p class="er" id="loginErr"></p>
    </div>
    <button class="bo" onclick="show('choice')">← Назад</button>
</div>

<!-- КАНАЛЫ -->
<div class="page" id="channels">
    <h1>DANILAH</h1>
    <p>📢 Каналы</p>
    <div class="box" onclick="openChannel('support')" style="cursor:pointer;">
        <b>🛟 Поддержка Danilah</b>
    </div>
    <div class="box" onclick="openChannel('news')" style="cursor:pointer;">
        <b>📰 Новости Danilah</b>
    </div>
    <button class="bp" onclick="show('profile')">👤 В профиль</button>
</div>

<!-- ПРОФИЛЬ -->
<div class="page" id="profile">
    <h1>DANILAH</h1>
    <div class="box">
        <p style="font-size:50px;margin:0;" id="pEmoji">👤</p>
        <h2 id="pName">Имя</h2>
        <p id="pUser">@user</p>
        <div id="pBadges"></div>
    </div>
    <button class="bo" onclick="show('chat')">💬 Сообщения</button>
    <button class="bb" onclick="show('createChat')">➕ Создать чат</button>
    <button class="bp" onclick="show('calls')">📞 Звонки</button>
    <button class="bg" onclick="verify()">🎫 Активировать код</button>
    <button class="bo" onclick="show('channels')">📢 Каналы</button>
    <button class="br" onclick="logout()">🚪 Выйти</button>
</div>

<!-- ЧАТ -->
<div class="page" id="chat">
    <h1>DANILAH</h1>
    <div class="box" id="chatBox" style="height:180px;overflow-y:auto;text-align:left;">
        <p class="sm">Чат</p>
    </div>
    <div style="display:flex;gap:5px;">
        <input type="text" id="msgInput" placeholder="Сообщение..." style="flex:1;">
        <button class="bp" onclick="sendMsg()" style="width:auto;">➤</button>
    </div>
    <button class="bo" onclick="show('profile')">← Назад</button>
</div>

<!-- СОЗДАТЬ ЧАТ -->
<div class="page" id="createChat">
    <h1>DANILAH</h1>
    <div class="box">
        <input type="text" id="chatName" placeholder="Название чата">
        <button class="bp" onclick="createGroup()">Создать</button>
        <p class="ok" id="chatMsg"></p>
    </div>
    <button class="bo" onclick="show('profile')">← Назад</button>
</div>

<!-- ЗВОНКИ -->
<div class="page" id="calls">
    <h1>DANILAH</h1>
    <div class="box">
        <p style="font-size:50px;">📞</p>
        <button class="bp" onclick="call('audio')">📞 Аудиозвонок</button>
        <button class="bb" onclick="call('video')">📹 Видеозвонок</button>
        <p class="sm" id="callStatus"></p>
    </div>
    <button class="bo" onclick="show('profile')">← Назад</button>
</div>

<script>
// БАЗА
var db = JSON.parse(localStorage.getItem('ddb')) || {
    users: [{ id: 'o1', name: 'Владелец', username: '@Durov', password: 'admin123', role: 'owner', status: 'premium', verified: true, emoji: '👑' }],
    code: 'QQO1098',
    sms: {}
};

function save() { localStorage.setItem('ddb', JSON.stringify(db)); }

var me = JSON.parse(localStorage.getItem('dme')) || null;

function show(id) {
    var pages = document.querySelectorAll('.page');
    for (var i = 0; i < pages.length; i++) pages[i].classList.remove('on');
    var el = document.getElementById(id);
    if (el) el.classList.add('on');
    if (id === 'profile') loadProfile();
}

// SMS
function getSMS() {
    var ph = document.getElementById('phone').value.replace(/\D/g, '');
    if (ph.length < 10) { alert('Введите номер'); return; }
    var code = Math.floor(100000 + Math.random() * 900000).toString();
    db.sms[ph] = code;
    save();
    document.getElementById('smsArea').style.display = 'block';
    document.getElementById('phoneMsg').textContent = '📱 Демо-код: ' + code;
}

function checkSMS() {
    var ph = document.getElementById('phone').value.replace(/\D/g, '');
    var code = document.getElementById('smsCode').value.trim();
    if (db.sms[ph] === code) {
        // Найти или создать
        var found = null;
        for (var i = 0; i < db.users.length; i++) {
            if (db.users[i].phone === ph) found = db.users[i];
        }
        if (!found) {
            found = { id: 'u' + Date.now(), name: 'Пользователь', username: '@user' + ph.slice(-4), password: 'pass' + Date.now().toString(36), role: 'user', status: 'basic', verified: false, emoji: '👤', phone: ph };
            db.users.push(found);
            save();
        }
        me = found;
        localStorage.setItem('dme', JSON.stringify(me));
        show('channels');
    } else {
        alert('Неверный код');
    }
}

// ВХОД ПО КОДУ
function login() {
    var u = document.getElementById('loginUser').value.trim();
    var p = document.getElementById('loginPass').value.trim();
    var found = null;
    for (var i = 0; i < db.users.length; i++) {
        if (db.users[i].username === u && db.users[i].password === p) found = db.users[i];
    }
    if (!found) { document.getElementById('loginErr').textContent = 'Неверный логин или пароль'; return; }
    me = found;
    localStorage.setItem('dme', JSON.stringify(me));
    show('channels');
}

// ПРОФИЛЬ
function loadProfile() {
    if (!me) { show('welcome'); return; }
    document.getElementById('pName').textContent = me.name;
    document.getElementById('pUser').textContent = me.username;
    document.getElementById('pEmoji').textContent = me.emoji || '👤';
    var b = '';
    if (me.verified) b += '<span class="badge bv">⭐</span> ';
    if (me.status === 'premium') b += '<span class="badge bprem">💎 Premium</span> ';
    document.getElementById('pBadges').innerHTML = b || 'Пользователь';
}

function verify() {
    var c = prompt('Секретный код:');
    if (c === db.code) {
        me.verified = true;
        for (var i = 0; i < db.users.length; i++) {
            if (db.users[i].id === me.id) { db.users[i].verified = true; break; }
        }
        save();
        localStorage.setItem('dme', JSON.stringify(me));
        loadProfile();
        alert('✅ Золотая галочка!');
    } else {
        alert('❌ Неверный код');
    }
}

function logout() {
    localStorage.removeItem('dme');
    me = null;
    show('welcome');
}

// КАНАЛЫ
function openChannel(type) {
    var box = document.getElementById('chatBox');
    if (type === 'support') {
        box.innerHTML = '<b>🛟 Поддержка:</b><p>Здравствуйте! @Durov поможет.</p>';
    } else {
        box.innerHTML = '<b>📰 Новости:</b><p>Добро пожаловать в Danilah Elite!</p>';
    }
    show('chat');
}

// ЧАТ
function sendMsg() {
    var m = document.getElementById('msgInput').value.trim();
    if (!m || !me) return;
    document.getElementById('chatBox').innerHTML += '<p><b>' + me.name + ':</b> ' + m + '</p>';
    document.getElementById('msgInput').value = '';
}

// СОЗДАТЬ ЧАТ
function createGroup() {
    var n = document.getElementById('chatName').value.trim();
    if (!n) return;
    document.getElementById('chatMsg').textContent = '✅ Чат "' + n + '" создан!';
    document.getElementById('chatName').value = '';
}

// ЗВОНКИ
function call(type) {
    document.getElementById('callStatus').textContent = '📞 Вызов...';
    setTimeout(function() { document.getElementById('callStatus').textContent = '📞 Разговор...'; }, 2000);
    setTimeout(function() { document.getElementById('callStatus').textContent = '📞 Завершён'; }, 5000);
}

// СТАРТ
if (me) show('channels');
else show('welcome');
</script>
</body>
    </html>
