<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danilah Elite v8.0</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#0a0a12;
            color:#fff;
            font-family:Arial,sans-serif;
            margin:0;
            touch-action:manipulation;
            -webkit-tap-highlight-color:transparent;
        }
        .app { max-width:480px; margin:0 auto; min-height:100vh; }
        .header {
            background:linear-gradient(135deg,#1a0f2e,#2a1a4e,#1a0f2e);
            padding:14px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            border-bottom:2px solid #7c3aed;
        }
        .logo { font-size:20px; font-weight:800; color:#a78bfa; }
        .menu-btn { background:none; border:none; color:#fff; font-size:24px; cursor:pointer; }
        .page { display:none; }
        .page.on { display:block; }
        .content { padding:14px; }
        button {
            display:block;
            width:100%;
            padding:15px;
            margin:8px 0;
            font-size:16px;
            font-weight:600;
            border:none;
            border-radius:12px;
            cursor:pointer;
        }
        .bp { background:#7c3aed; color:#fff; }
        .bo { background:transparent; border:2px solid #7c3aed; color:#a78bfa; }
        .bg { background:#f59e0b; color:#000; }
        .br { background:#ef4444; color:#fff; }
        .bb { background:#06b6d4; color:#000; }
        input {
            display:block;
            width:100%;
            padding:14px;
            margin:6px 0;
            background:#0d0d18;
            border:1px solid #2a2a38;
            color:#fff;
            font-size:15px;
            border-radius:10px;
        }
        .box {
            background:#141420;
            border-radius:14px;
            padding:14px;
            margin:8px 0;
            border:1px solid #2a2a38;
        }
        .sm { font-size:12px; color:#9ca3af; }
        .list-item {
            display:flex;
            align-items:center;
            gap:12px;
            padding:14px;
            background:#141420;
            border-radius:14px;
            margin:6px 0;
            cursor:pointer;
            border:1px solid #2a2a38;
        }
        .avatar {
            width:46px;
            height:46px;
            border-radius:50%;
            background:#7c3aed;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            flex-shrink:0;
        }
        .msg-ai {
            background:#1a1a28;
            border-left:3px solid #06b6d4;
            padding:10px 14px;
            border-radius:10px;
            margin:6px 0;
            font-size:14px;
        }
        .msg-user {
            background:#7c3aed;
            padding:10px 14px;
            border-radius:10px;
            margin:6px 0;
            font-size:14px;
            text-align:right;
        }
        .online-badge {
            background:rgba(34,197,94,0.2);
            color:#22c55e;
            padding:4px 12px;
            border-radius:20px;
            font-size:13px;
            display:inline-block;
            margin:8px 0;
        }
    </style>
</head>
<body>

<div class="app">

    <!-- ШАПКА -->
    <div class="header" id="mainHeader" style="display:none;">
        <button class="menu-btn" onclick="openMenu()">☰</button>
        <span class="logo">🐉 DANILAH</span>
        <span>👑</span>
    </div>
    <div class="content" id="mainContent" style="display:none;"></div>

    <!-- ПРИВЕТСТВИЕ -->
    <div class="page on" id="welcomePage">
        <div style="text-align:center;padding:60px 20px;">
            <p style="font-size:80px;">🐉</p>
            <h1 style="color:#a78bfa;font-size:28px;">DANILAH</h1>
            <p>Элитный мессенджер</p>
            <p class="sm">Закрытая экосистема @Durov</p>
            <div class="online-badge" id="onlineCount">👥 Онлайн: 1</div>
            <br><br>
            <button class="bp" onclick="showLogin()">🚀 Начать</button>
        </div>
    </div>

    <!-- ВХОД -->
    <div class="page" id="loginPage">
        <div style="padding:30px 20px;">
            <h2 style="color:#a78bfa;text-align:center;">🐉 DANILAH</h2>
            <p class="sm" style="text-align:center;">Выберите способ входа</p>
            <br>
            <button class="bp" onclick="showPhone()">📱 По номеру телефона</button>
            <button class="bo" onclick="showCode()">🔐 По коду</button>
            <button class="bo" onclick="showAIHelp()">🤖 Нет кода — спросить ИИ</button>
        </div>
    </div>

    <!-- ИИ ПОМОЩЬ -->
    <div class="page" id="aiHelpPage">
        <div class="content">
            <h2 style="color:#a78bfa;">🤖 Danilah AI</h2>
            <div class="box" style="height:250px;overflow-y:auto;" id="aiHelpChat">
                <div class="msg-ai">👋 Привет! Я помощник по кодам. Я уже обработал твою заявку! В скором времени тебе ответит владелец с твоим кодом!</div>
            </div>
            <div style="display:flex;gap:5px;">
                <input type="text" id="aiHelpInput" placeholder="Напишите..." style="flex:1;">
                <button class="bp" onclick="sendAIHelp()" style="width:auto;">➤</button>
            </div>
            <button class="bo" onclick="showLogin()">← Назад</button>
        </div>
    </div>

    <!-- ТЕЛЕФОН -->
    <div class="page" id="phonePage">
        <div class="content">
            <h2 style="color:#a78bfa;">📱 Номер телефона</h2>
            <input type="tel" id="phone" placeholder="+7 999 123-45-67">
            <button class="bp" onclick="sendSMS()">Получить код</button>
            <p class="sm" id="smsMsg"></p>
            <button class="bo" onclick="showLogin()">← Назад</button>
        </div>
    </div>

    <!-- ВХОД ПО КОДУ -->
    <div class="page" id="codePage">
        <div class="content">
            <h2 style="color:#a78bfa;">🔐 Вход по коду</h2>
            <input type="text" id="accessCode" placeholder="Код доступа">
            <input type="text" id="loginUser" placeholder="@Username">
            <button class="bp" onclick="loginWithCode()">Войти</button>
            <p class="sm" id="loginErr" style="color:#ef4444;"></p>
            <button class="bo" onclick="showLogin()">← Назад</button>
        </div>
    </div>

</div>

<script>
var db = JSON.parse(localStorage.getItem('ddb')) || {
    users: [{ id:'o1', name:'Владелец', username:'@Durov', password:'admin123', role:'owner', status:'premium', verified:true, emoji:'🐉', phone:'', stars:0, freeMessageUsed:false }],
    apps: [], msgs: [], code: 'QQO1098', sms: {}, announcements: [], ideas: [],
    gifts: [{name:'🧸 Мишка',price:15},{name:'🎁 Подарок',price:25},{name:'💍 Колечко',price:50},{name:'🚀 Ракета',price:100},{name:'👑 Danilah',price:1000}],
    starPrices: [{stars:100,price:50},{stars:150,price:100},{stars:200,price:150},{stars:500,price:450},{stars:1000,price:700},{stars:10000,price:'Запросить'}],
    updates: [{title:'🎉 Запуск',desc:'Danilah запущен!'}]
};
function save() { localStorage.setItem('ddb', JSON.stringify(db)); }
var me = JSON.parse(localStorage.getItem('dme')) || null;

function hideAll() {
    var ps = document.querySelectorAll('.page');
    for (var i=0;i<ps.length;i++) ps[i].classList.remove('on');
}
function showLogin() { hideAll(); document.getElementById('loginPage').classList.add('on'); }
function showPhone() { hideAll(); document.getElementById('phonePage').classList.add('on'); }
function showCode() { hideAll(); document.getElementById('codePage').classList.add('on'); }
function showAIHelp() { hideAll(); document.getElementById('aiHelpPage').classList.add('on'); }
function showMain() { hideAll(); document.getElementById('mainHeader').style.display='flex'; document.getElementById('mainContent').style.display='block'; loadChats(); }

function sendAIHelp() {
    var inp = document.getElementById('aiHelpInput');
    var txt = inp.value.trim();
    if (!txt) return;
    var box = document.getElementById('aiHelpChat');
    box.innerHTML += '<div class="msg-user">' + txt + '</div>';
    inp.value = '';
    setTimeout(function() {
        box.innerHTML += '<div class="msg-ai">✅ Я уже отправил твою заявку владельцу! @Durov скоро ответит с кодом. Жду не дождусь, пока ты будешь в нашем мессенджере! 💜</div>';
        box.scrollTop = box.scrollHeight;
    }, 500);
}

function sendSMS() {
    var ph = document.getElementById('phone').value.replace(/\D/g,'');
    if (ph.length < 10) { alert('Введите номер'); return; }
    var code = Math.floor(100000 + Math.random() * 900000).toString();
    db.sms[ph] = code;
    save();
    document.getElementById('smsMsg').textContent = '📱 Код: ' + code;
    var found = null;
    for (var i=0;i<db.users.length;i++) { if (db.users[i].phone === ph) found = db.users[i]; }
    if (!found) {
        found = { id:'u'+Date.now(), name:'Пользователь', username:'@user'+ph.slice(-4), password:'', role:'user', status:'basic', verified:false, emoji:'🐉', phone:ph, stars:0, freeMessageUsed:false };
        db.users.push(found);
        save();
    }
    me = found;
    localStorage.setItem('dme', JSON.stringify(me));
    showMain();
}

function loginWithCode() {
    var code = document.getElementById('accessCode').value.trim();
    var user = document.getElementById('loginUser').value.trim();
    if (!code || !user) { document.getElementById('loginErr').textContent = 'Заполните оба поля'; return; }
    var found = null;
    for (var i=0;i<db.users.length;i++) {
        var u = db.users[i];
        if (u.username === user && (u.password === code || db.code === code)) found = u;
    }
    if (!found) { document.getElementById('loginErr').textContent = 'Неверно'; return; }
    me = found;
    localStorage.setItem('dme', JSON.stringify(me));
    showMain();
}

function loadChats() {
    var c = document.getElementById('mainContent');
    var h = '<h2 style="color:#a78bfa;">💬 Чаты</h2>';
    h += '<div class="list-item" onclick="loadAI()"><div class="avatar">🤖</div><div style="flex:1;"><b>Danilah AI</b><p class="sm">Помощник</p></div></div>';
    h += '<div class="list-item" onclick="loadSupport()"><div class="avatar">🛟</div><div style="flex:1;"><b>Поддержка</b><p class="sm">@Durov</p></div></div>';
    for (var i=0;i<db.users.length;i++) {
        var u = db.users[i];
        if (u.id !== me.id) {
            h += '<div class="list-item" onclick="openChat(\'' + u.username + '\',\'' + u.name + '\')"><div class="avatar">' + (u.emoji||'👤') + '</div><div style="flex:1;"><b>' + u.name + '</b><p class="sm">' + u.username + '</p></div></div>';
        }
    }
    c.innerHTML = h;
}

function loadAI() {
    var c = document.getElementById('mainContent');
    c.innerHTML = '<h2 style="color:#a78bfa;">🤖 Danilah AI</h2><div class="box" style="height:200px;overflow-y:auto;" id="aiBox"><div class="msg-ai">👋 Привет! Спроси меня о коде!</div></div><div style="display:flex;gap:5px;"><input type="text" id="aiInput" placeholder="Спроси..." style="flex:1;"><button class="bp" onclick="sendAI()" style="width:auto;">➤</button></div><button class="bo" onclick="loadChats()">← Назад</button>';
}

function sendAI() {
    var inp = document.getElementById('aiInput');
    var txt = inp.value.trim();
    if (!txt) return;
    var box = document.getElementById('aiBox');
    box.innerHTML += '<div class="msg-user">' + txt + '</div>';
    var q = txt.toLowerCase();
    var ans = '🤖 Я учусь! Спроси про кнопки, чаты или звёзды.';
    if (q.indexOf('кнопк') !== -1) ans = '💻 Кнопка: <button onclick="функция()">Текст</button>';
    if (q.indexOf('привет') !== -1) ans = '👋 Привет! Я ИИ Danilah!';
    if (q.indexOf('звёзд') !== -1) ans = '⭐ Звёзды — валюта Danilah.';
    box.innerHTML += '<div class="msg-ai">' + ans + '</div>';
    inp.value = '';
}

function loadSupport() {
    var c = document.getElementById('mainContent');
    c.innerHTML = '<h2 style="color:#a78bfa;">🛟 Поддержка</h2><div class="box"><p class="sm">Выберите вопрос:</p></div><button class="bo" onclick="supQ(\'Как получить код?\')">Как получить код?</button><button class="bo" onclick="supQ(\'Как купить звёзды?\')">Как купить звёзды?</button><button class="bo" onclick="supQ(\'Как получить Premium?\')">Как получить Premium?</button><button class="bo" onclick="loadChats()">← Назад</button>';
}

function supQ(q) {
    alert('✅ Заявка отправлена! @Durov ответит.');
    loadChats();
}

function openChat(un, name) {
    var c = document.getElementById('mainContent');
    c.innerHTML = '<h2 style="color:#a78bfa;">💬 ' + name + '</h2><div class="box" style="height:200px;overflow-y:auto;" id="chatBox"><p class="sm">Начните переписку...</p></div><div style="display:flex;gap:5px;"><input type="text" id="msgInput" placeholder="Сообщение..." style="flex:1;"><button class="bp" onclick="sendMsg(\'' + un + '\')" style="width:auto;">➤</button></div><button class="bo" onclick="loadChats()">← Назад</button>';
}

function sendMsg(to) {
    var inp = document.getElementById('msgInput');
    var txt = inp.value.trim();
    if (!txt) return;
    var box = document.getElementById('chatBox');
    box.innerHTML += '<p><b>' + me.username + ':</b> ' + txt + '</p>';
    inp.value = '';
}

function openMenu() {
    alert('☰ Меню в разработке');
}

function logout() {
    localStorage.removeItem('dme');
    me = null;
    document.getElementById('mainHeader').style.display = 'none';
    document.getElementById('mainContent').style.display = 'none';
    hideAll();
    document.getElementById('welcomePage').classList.add('on');
}

if (me) { showMain(); } else { document.getElementById('mainHeader').style.display='none'; document.getElementById('mainContent').style.display='none'; }
</script>
</body>
    </html>
