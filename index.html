<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danilah</title>
    <style>
        body {
            background: #0a0a12;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        
        button {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .btn-purple { background: #7c3aed; color: white; }
        .btn-outline { background: transparent; border: 2px solid #8b5cf6; color: #8b5cf6; }
        .btn-gold { background: #f59e0b; color: black; }
        .btn-red { background: #ef4444; color: white; }
        
        input {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background: #111;
            border: 1px solid #333;
            color: white;
            font-size: 16px;
            border-radius: 10px;
        }
        .card {
            background: #1a1a28;
            padding: 16px;
            border-radius: 14px;
            margin: 12px 0;
            text-align: left;
        }
        .small { font-size: 12px; color: #999; }
        .err { color: #ef4444; font-size: 14px; }
        .ok { color: #22c55e; font-size: 14px; }
        h1 { color: #a78bfa; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ПРИВЕТСТВИЕ -->
    <div id="screen1" class="screen active">
        <h1>DANILAH</h1>
        <p>Добро пожаловать</p>
        <button class="btn-purple" onclick="showScreen('screen2')">🚀 Начать</button>
    </div>

    <!-- ЭКРАН 2: ВЫБОР ВХОДА -->
    <div id="screen2" class="screen">
        <h1>DANILAH</h1>
        <p>Выберите способ входа</p>
        <button class="btn-purple" onclick="showScreen('screen3')">📱 Войти по номеру телефона</button>
        <p class="small">Быстрый вход через SMS-код</p>
        <button class="btn-outline" onclick="showScreen('screen4')">🔐 Войти по коду</button>
        <p class="small">Займет больше времени, чем кодом</p>
    </div>

    <!-- ЭКРАН 3: ВХОД ПО ТЕЛЕФОНУ -->
    <div id="screen3" class="screen">
        <h1>DANILAH</h1>
        <div class="card">
            <p>📱 Номер телефона</p>
            <input type="tel" id="phone" placeholder="+7 999 123-45-67">
            <button class="btn-purple" onclick="phoneLogin()">Получить код</button>
            <p class="err" id="phoneErr"></p>
            <p class="ok" id="phoneOk"></p>
        </div>
        <button class="btn-outline" onclick="showScreen('screen2')">← Назад</button>
    </div>

    <!-- ЭКРАН 4: ВХОД ПО КОДУ -->
    <div id="screen4" class="screen">
        <h1>DANILAH</h1>
        <div class="card">
            <p>🔐 Авторизация</p>
            <input type="text" id="username" placeholder="@Username">
            <input type="password" id="password" placeholder="Код-пароль">
            <button class="btn-purple" onclick="codeLogin()">Войти</button>
            <p class="err" id="loginErr"></p>
        </div>
        <button class="btn-outline" onclick="showScreen('screen2')">← Назад</button>
    </div>

    <!-- ЭКРАН 5: ПРОФИЛЬ -->
    <div id="screen5" class="screen">
        <h1>DANILAH</h1>
        <div class="card">
            <h2 id="profName">Имя</h2>
            <p id="profUsername">@user</p>
        </div>
        <button class="btn-outline" onclick="showScreen('screen6')">💬 Сообщения</button>
        <button class="btn-gold" onclick="activateCode()">🎫 Активировать код</button>
        <button class="btn-red" onclick="logout()">🚪 Выйти</button>
    </div>

    <!-- ЭКРАН 6: ЧАТ -->
    <div id="screen6" class="screen">
        <h1>DANILAH</h1>
        <div class="card" id="chatBox" style="height:200px;overflow-y:auto;">
            <p class="small">Чат</p>
        </div>
        <input type="text" id="msgInput" placeholder="Сообщение...">
        <button class="btn-purple" onclick="sendMsg()">Отправить</button>
        <button class="btn-outline" onclick="showScreen('screen5')">← Назад</button>
    </div>

    <script>
        // БАЗА
        var db = JSON.parse(localStorage.getItem('db')) || {
            users: [{ id: 'o1', name: 'Владелец', username: '@Durov', password: 'admin123', role: 'owner', status: 'premium',
                verified: true }
            ],
            msgs: [],
            code: 'QQO1098'
        };

        function save() { localStorage.setItem('db', JSON.stringify(db)); }

        function showScreen(id) {
            var screens = document.querySelectorAll('.screen');
            for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
            document.getElementById(id).classList.add('active');
        }

        // ВХОД ПО ТЕЛЕФОНУ
        function phoneLogin() {
            var phone = document.getElementById('phone').value.replace(/\D/g, '');
            if (phone.length < 10) { document.getElementById('phoneErr').textContent = 'Введите номер'; return; }
            // Ищем юзера
            var found = null;
            for (var i = 0; i < db.users.length; i++) {
                if (db.users[i].phone === phone) found = db.users[i];
            }
            if (!found) {
                document.getElementById('phoneOk').textContent = 'Номер не найден. Заявка отправлена @Durov.';
                return;
            }
            var code = prompt('Демо: введите 123456', '123456');
            if (code === '123456') {
                localStorage.setItem('user', JSON.stringify(found));
                showScreen('screen5');
                loadProfile();
            }
        }

        // ВХОД ПО КОДУ
        function codeLogin() {
            var u = document.getElementById('username').value.trim();
            var p = document.getElementById('password').value.trim();
            var found = null;
            for (var i = 0; i < db.users.length; i++) {
                if (db.users[i].username === u) found = db.users[i];
            }
            if (!found || found.password !== p) {
                document.getElementById('loginErr').textContent = 'Неверный логин или пароль';
                return;
            }
            localStorage.setItem('user', JSON.stringify(found));
            showScreen('screen5');
            loadProfile();
        }

        function loadProfile() {
            var u = JSON.parse(localStorage.getItem('user'));
            document.getElementById('profName').textContent = u.name;
            document.getElementById('profUsername').textContent = u.username;
        }

        function logout() { localStorage.removeItem('user');
            showScreen('screen1'); }

        function activateCode() {
            var c = prompt('Код:');
            if (c === db.code) alert('✅ Галочка!');
            else alert('❌ Неверно');
        }

        function sendMsg() {
            var msg = document.getElementById('msgInput').value;
            var box = document.getElementById('chatBox');
            box.innerHTML += '<p><b>Вы:</b> ' + msg + '</p>';
            document.getElementById('msgInput').value = '';
        }

        // СТАРТ
        var user = JSON.parse(localStorage.getItem('user'));
        if (user) { showScreen('screen5');
            loadProfile(); }
    </script>
</body>
            </html>
