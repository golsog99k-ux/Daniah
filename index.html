<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danilah Elite</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#0a0a12;
            color:#fff;
            font-family:Arial,sans-serif;
            margin:0;
            touch-action:manipulation;
            -webkit-tap-highlight-color:transparent;
        }
        .app { max-width:480px; margin:0 auto; min-height:100vh; }
        .header {
            background:#1a0f2e;
            padding:14px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            border-bottom:1px solid #2a2a38;
        }
        .logo {
            font-size:20px;
            font-weight:800;
            color:#a78bfa;
        }
        .menu-btn {
            background:none;
            border:none;
            color:#fff;
            font-size:24px;
            cursor:pointer;
        }
        .page { display:none; }
        .page.on { display:block; }
        .content { padding:14px; }
        button {
            display:block;
            width:100%;
            padding:15px;
            margin:8px 0;
            font-size:16px;
            font-weight:600;
            border:none;
            border-radius:12px;
            cursor:pointer;
        }
        .bp { background:#7c3aed; color:#fff; }
        .bo { background:transparent; border:2px solid #7c3aed; color:#a78bfa; }
        .bg { background:#f59e0b; color:#000; }
        .br { background:#ef4444; color:#fff; }
        .bb { background:#06b6d4; color:#000; }
        input {
            display:block;
            width:100%;
            padding:14px;
            margin:6px 0;
            background:#0d0d18;
            border:1px solid #2a2a38;
            color:#fff;
            font-size:15px;
            border-radius:10px;
        }
        .box {
            background:#141420;
            border-radius:14px;
            padding:14px;
            margin:8px 0;
            border:1px solid #2a2a38;
        }
        .sm { font-size:12px; color:#9ca3af; }
        .sidebar {
            position:fixed;
            top:0;
            left:-280px;
            width:270px;
            height:100vh;
            background:#141420;
            z-index:100;
            transition:left 0.25s;
            overflow-y:auto;
        }
        .sidebar.open { left:0; }
        .overlay {
            position:fixed;
            top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.6);
            z-index:99;
            display:none;
        }
        .overlay.show { display:block; }
        .mi {
            display:flex;
            align-items:center;
            gap:12px;
            padding:14px 20px;
            font-size:15px;
            cursor:pointer;
            border:none;
            background:none;
            color:#fff;
            width:100%;
            text-align:left;
        }
        .mi:active { background:#2a2a38; }
        .list-item {
            display:flex;
            align-items:center;
            gap:12px;
            padding:14px;
            background:#141420;
            border-radius:14px;
            margin:6px 0;
            cursor:pointer;
            border:1px solid #2a2a38;
        }
        .list-item:active { background:#1e1e2e; }
        .avatar {
            width:46px;
            height:46px;
            border-radius:50%;
            background:#7c3aed;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
            flex-shrink:0;
        }
        .badge { display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;margin:2px; }
        .bv { background:rgba(245,158,11,0.2); color:#f59e0b; }
        .bprem { background:rgba(6,182,212,0.2); color:#06b6d4; }
    </style>
</head>
<body>

<div class="app">

    <!-- БОКОВОЕ МЕНЮ -->
    <div class="overlay" id="overlay" onclick="closeMenu()"></div>
    <div class="sidebar" id="sidebar">
        <div style="padding:20px;text-align:center;background:#1a0f2e;">
            <div class="avatar" id="mAv" style="margin:0 auto 10px;width:70px;height:70px;font-size:32px;">👤</div>
            <b id="mName">Имя</b>
            <p class="sm" id="mUser">@user</p>
            <div id="mBadges"></div>
        </div>
        <button class="mi" onclick="openPage('chats')">💬 Чаты</button>
        <button class="mi" onclick="openPage('contacts')">👥 Контакты</button>
        <button class="mi" onclick="openPage('channels')">📢 Каналы</button>
        <button class="mi" onclick="openPage('calls')">📞 Звонки</button>
        <button class="mi" onclick="openPage('settings')">⚙️ Настройки</button>
        <button class="mi" onclick="openPage('about')">ℹ️ О Danilah</button>
        <div style="border-top:1px solid #2a2a38;margin:8px 0;"></div>
        <button class="mi" id="adminBtn" onclick="openPage('admin')" style="display:none;">👑 Админ-панель</button>
        <button class="mi" onclick="logout()" style="color:#ef4444;">🚪 Выйти</button>
    </div>

    <!-- ШАПКА -->
    <div class="header" id="mainHeader" style="display:none;">
        <button class="menu-btn" onclick="openMenu()">☰</button>
        <span class="logo">DANILAH</span>
        <span>👑</span>
    </div>
    <div class="content" id="mainContent" style="display:none;"></div>

    <!-- ПРИВЕТСТВИЕ -->
    <div class="page on" id="welcomePage">
        <div style="text-align:center;padding:80px 20px;">
            <p style="font-size:70px;">👑</p>
            <h1 style="color:#a78bfa;font-size:28px;">DANILAH</h1>
            <p>Элитный мессенджер</p>
            <p class="sm">Закрытая экосистема @Durov</p>
            <br><br>
            <button class="bp" onclick="showLogin()">🚀 Начать</button>
        </div>
    </div>

    <!-- ВХОД -->
    <div class="page" id="loginPage">
        <div style="padding:30px 20px;">
            <h2 style="color:#a78bfa;text-align:center;">DANILAH</h2>
            <p class="sm" style="text-align:center;">Выберите способ входа</p>
            <br>
            <button class="bp" onclick="showPhone()">📱 По номеру телефона</button>
            <button class="bo" onclick="showCode()">🔐 По коду</button>
            <button class="bo" onclick="showApply()">🆘 Запросить код</button>
        </div>
    </div>

    <!-- ТЕЛЕФОН -->
    <div class="page" id="phonePage">
        <div class="content">
            <h2 style="color:#a78bfa;">📱 Номер телефона</h2>
            <input type="tel" id="phone" placeholder="+7 999 123-45-67">
            <button class="bp" onclick="sendSMS()">Получить код</button>
            <div id="smsBox" style="display:none;">
                <input type="text" id="smsInput" placeholder="Код из SMS">
                <button class="bp" onclick="verifySMS()">Подтвердить</button>
            </div>
            <p class="sm" id="smsMsg"></p>
            <button class="bo" onclick="showLogin()">← Назад</button>
        </div>
    </div>

    <!-- ВХОД ПО КОДУ -->
    <div class="page" id="codePage">
        <div class="content">
            <h2 style="color:#a78bfa;">🔐 Вход по коду</h2>
            <p class="sm">Сначала код, потом @Username</p>
            <input type="text" id="accessCode" placeholder="Код доступа">
            <input type="text" id="loginUser" placeholder="@Username">
            <button class="bp" onclick="loginWithCode()">Войти</button>
            <p class="sm" id="loginErr" style="color:#ef4444;"></p>
            <button class="bo" onclick="showLogin()">← Назад</button>
        </div>
    </div>

    <!-- ЗАЯВКА -->
    <div class="page" id="applyPage">
        <div class="content">
            <h2 style="color:#a78bfa;">🆘 Заявка на доступ</h2>
            <p class="sm">@Durov выдаст вам код</p>
            <input type="text" id="applyName" placeholder="Ваше имя">
            <input type="text" id="applyUser" placeholder="Желаемый @Username">
            <button class="bp" onclick="submitApply()">Отправить</button>
            <p class="sm" id="applyOk" style="color:#22c55e;"></p>
            <button class="bo" onclick="showLogin()">← Назад</button>
        </div>
    </div>

</div>

<script>
// БАЗА
var db = JSON.parse(localStorage.getItem('ddb')) || {
    users: [
        { id:'o1', name:'Владелец', username:'@Durov', password:'admin123', role:'owner', status:'premium', verified:true, emoji:'👑', phone:'' }
    ],
    apps: [],
    msgs: [],
    code: 'QQO1098',
    sms: {},
    updates: [
        { title:'🎉 Запуск', desc:'Danilah Elite запущен!' },
        { title:'💎 Premium', desc:'Эксклюзивные функции' },
        { title:'🌐 Языки', desc:'Скоро' }
    ]
};
function save() { localStorage.setItem('ddb', JSON.stringify(db)); }
var me = JSON.parse(localStorage.getItem('dme')) || null;

// НАВИГАЦИЯ
function showLogin() {
    hideAll();
    document.getElementById('loginPage').classList.add('on');
}
function showPhone() {
    hideAll();
    document.getElementById('phonePage').classList.add('on');
}
function showCode() {
    hideAll();
    document.getElementById('codePage').classList.add('on');
}
function showApply() {
    hideAll();
    document.getElementById('applyPage').classList.add('on');
}
function hideAll() {
    var ps = document.querySelectorAll('.page');
    for (var i=0;i<ps.length;i++) ps[i].classList.remove('on');
}
function showMain() {
    hideAll();
    document.getElementById('mainHeader').style.display = 'flex';
    document.getElementById('mainContent').style.display = 'block';
    loadChats();
}

// МЕНЮ
function openMenu() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('show');
    if (me) {
        document.getElementById('mAv').textContent = me.emoji || '👤';
        document.getElementById('mName').textContent = me.name;
        document.getElementById('mUser').textContent = me.username;
        var b = '';
        if (me.verified) b += '<span class="badge bv">⭐</span> ';
        if (me.status === 'premium') b += '<span class="badge bprem">💎</span> ';
        document.getElementById('mBadges').innerHTML = b;
        document.getElementById('adminBtn').style.display = me.role === 'owner' ? 'flex' : 'none';
    }
}
function closeMenu() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
}
function openPage(page) {
    closeMenu();
    if (page === 'chats') loadChats();
    if (page === 'contacts') loadContacts();
    if (page === 'channels') loadChannels();
    if (page === 'calls') loadCalls();
    if (page === 'settings') loadSettings();
    if (page === 'about') loadAbout();
    if (page === 'admin') loadAdmin();
}

// СТРАНИЦЫ
function loadChats() {
    var c = document.getElementById('mainContent');
    var h = '<h2 style="color:#a78bfa;">💬 Чаты</h2>';
    h += '<div class="list-item" onclick="openChat(\'@Durov\',\'Поддержка\')"><div class="avatar">🛟</div><div style="flex:1;"><b>Поддержка Danilah</b><p class="sm">@Durov</p></div></div>';
    for (var i=0;i<db.users.length;i++) {
        var u = db.users[i];
        if (u.id !== me.id) {
            h += '<div class="list-item" onclick="openChat(\'' + u.username + '\',\'' + u.name + '\')"><div class="avatar">' + (u.emoji||'👤') + '</div><div style="flex:1;"><b>' + u.name + '</b> ' + (u.verified?'⭐':'') + (u.status==='premium'?'💎':'') + '<p class="sm">' + u.username + '</p></div></div>';
        }
    }
    c.innerHTML = h;
}
function loadContacts() {
    var c = document.getElementById('mainContent');
    var h = '<h2 style="color:#a78bfa;">👥 Контакты</h2>';
    for (var i=0;i<db.users.length;i++) {
        var u = db.users[i];
        h += '<div class="list-item" onclick="openChat(\'' + u.username + '\',\'' + u.name + '\')"><div class="avatar">' + (u.emoji||'👤') + '</div><div style="flex:1;"><b>' + u.name + '</b> ' + (u.verified?'⭐':'') + (u.status==='premium'?'💎':'') + '<p class="sm">' + u.username + '</p></div></div>';
    }
    c.innerHTML = h;
}
function loadChannels() {
    var c = document.getElementById('mainContent');
    var h = '<h2 style="color:#a78bfa;">📢 Каналы</h2>';
    if (me && me.role === 'owner') {
        h += '<div class="list-item" onclick="loadAdmin(\'apps\')"><div class="avatar">📋</div><div style="flex:1;"><b>Заявки на доступ</b><p class="sm">' + db.apps.length + ' ожидают</p></div></div>';
    }
    h += '<div class="list-item" onclick="openChannel(\'news\')"><div class="avatar">📰</div><div style="flex:1;"><b>Новости Danilah</b><p class="sm">Обновления</p></div></div>';
    h += '<div class="list-item" onclick="openChannel(\'updates\')"><div class="avatar">🔄</div><div style="flex:1;"><b>Что нового?</b><p class="sm">История</p></div></div>';
    c.innerHTML = h;
}
function loadCalls() {
    var c = document.getElementById('mainContent');
    c.innerHTML = '<h2 style="color:#a78bfa;">📞 Звонки</h2><div class="box" style="text-align:center;"><p style="font-size:50px;">📞</p><button class="bp" onclick="startCall()">📞 Аудиозвонок</button><button class="bb" onclick="startCall()">📹 Видеозвонок</button><p class="sm" id="callStatus"></p></div>';
}
function loadSettings() {
    var c = document.getElementById('mainContent');
    var h = '<h2 style="color:#a78bfa;">⚙️ Настройки</h2>';
    h += '<div class="box"><b>' + me.name + '</b> ' + (me.verified?'⭐':'') + (me.status==='premium'?'💎':'') + '<p class="sm">' + me.username + '</p></div>';
    h += '<button class="bp" onclick="activateCode()">🎫 Активировать код</button>';
    if (me.role === 'owner') {
        h += '<div class="box"><b>👑 Владелец</b><button class="bb" onclick="givePremium()">💎 Выдать Premium</button></div>';
    } else {
        h += '<button class="bo" onclick="alert(\'💎 Свяжитесь с @Durov\')">💎 Хочу Premium</button>';
    }
    h += '<button class="br" onclick="logout()">🚪 Выйти</button>';
    c.innerHTML = h;
}
function loadAbout() {
    var c = document.getElementById('mainContent');
    var h = '<h2 style="color:#a78bfa;">ℹ️ О Danilah</h2><div class="box"><b>Danilah Elite v7.0</b><p class="sm">Закрытая экосистема @Durov</p></div>';
    for (var i=0;i<db.updates.length;i++) {
        h += '<div class="box"><b>' + db.updates[i].title + '</b><p class="sm">' + db.updates[i].desc + '</p></div>';
    }
    c.innerHTML = h;
}
function loadAdmin(tab) {
    var c = document.getElementById('mainContent');
    var h = '<h2 style="color:#a78bfa;">👑 Админ</h2>';
    h += '<div style="display:flex;gap:4px;margin-bottom:8px;">';
    h += '<button class="bp" style="flex:1;font-size:12px;padding:10px;" onclick="loadAdmin(\'apps\')">📋 Заявки</button>';
    h += '<button class="bo" style="flex:1;font-size:12px;padding:10px;" onclick="loadAdmin(\'users\')">👥 Люди</button>';
    h += '<button class="bg" style="flex:1;font-size:12px;padding:10px;" onclick="loadAdmin(\'codes\')">🔑 Коды</button>';
    h += '</div>';
    if (!tab || tab === 'apps') {
        if (!db.apps.length) h += '<p class="sm">Нет заявок</p>';
        for (var i=0;i<db.apps.length;i++) {
            h += '<div class="box"><b>' + db.apps[i].name + '</b> — ' + db.apps[i].username + '<br><button class="bp" onclick="approve(' + i + ')" style="display:inline-block;width:auto;margin:3px;">✅ Принять</button><button class="br" onclick="reject(' + i + ')" style="display:inline-block;width:auto;margin:3px;">❌ Отклонить</button></div>';
        }
    }
    if (tab === 'users') {
        for (var i=0;i<db.users.length;i++) {
            var u = db.users[i];
            h += '<div class="box"><b>' + u.name + '</b> ' + (u.verified?'⭐':'') + (u.status==='premium'?'💎':'') + '<p class="sm">' + u.username + '</p><button class="bp" onclick="toggleV(\'' + u.id + '\')" style="display:inline-block;width:auto;margin:3px;">' + (u.verified?'Снять ⭐':'Выдать ⭐') + '</button><button class="bb" onclick="toggleP(\'' + u.id + '\')" style="display:inline-block;width:auto;margin:3px;">' + (u.status==='premium'?'Снять 💎':'Выдать 💎') + '</button></div>';
        }
    }
    if (tab === 'codes') {
        h += '<div class="box"><b>Код доступа:</b> ' + db.code + '<br><input type="text" id="nc" placeholder="Новый код"><button class="bg" onclick="updateCode()">Изменить</button></div>';
    }
    c.innerHTML = h;
}

// ЧАТ
function openChat(un, name) {
    var c = document.getElementById('mainContent');
    var msgs = [];
    for (var i=0;i<db.msgs.length;i++) {
        if ((db.msgs[i].from === me.username && db.msgs[i].to === un) || (db.msgs[i].from === un && db.msgs[i].to === me.username)) msgs.push(db.msgs[i]);
    }
    var h = '<h2 style="color:#a78bfa;">💬 ' + name + '</h2><div class="box" style="height:220px;overflow-y:auto;text-align:left;">';
    if (!msgs.length) h += '<p class="sm">Начните переписку...</p>';
    for (var j=0;j<msgs.length;j++) h += '<p style="margin:4px 0;"><b>' + msgs[j].from + ':</b> ' + msgs[j].text + '</p>';
    h += '</div><div style="display:flex;gap:5px;"><input type="text" id="msgInput" placeholder="Сообщение..." style="flex:1;"><button class="bp" onclick="sendMsg(\'' + un + '\')" style="width:auto;">➤</button></div><button class="bo" onclick="loadChats()">← Назад</button>';
    c.innerHTML = h;
}
function sendMsg(to) {
    var inp = document.getElementById('msgInput');
    var txt = inp.value.trim();
    if (!txt || !me) return;
    db.msgs.push({ from: me.username, to: to, text: txt, time: new Date().toISOString() });
    save();
    openChat(to, to.replace('@',''));
}
function openChannel(type) {
    var c = document.getElementById('mainContent');
    if (type === 'news') c.innerHTML = '<h2 style="color:#a78bfa;">📰 Новости</h2><div class="box"><p>Добро пожаловать в Danilah Elite!</p></div><button class="bo" onclick="loadChannels()">← Назад</button>';
    else {
        var h = '<h2 style="color:#a78bfa;">🔄 Обновления</h2>';
        for (var i=0;i<db.updates.length;i++) h += '<div class="box"><b>' + db.updates[i].title + '</b><p class="sm">' + db.updates[i].desc + '</p></div>';
        h += '<button class="bo" onclick="loadChannels()">← Назад</button>';
        c.innerHTML = h;
    }
}

// ВХОД
function sendSMS() {
    var ph = document.getElementById('phone').value.replace(/\D/g,'');
    if (ph.length < 10) { alert('Введите номер'); return; }
    var code = Math.floor(100000 + Math.random() * 900000).toString();
    db.sms[ph] = code;
    save();
    document.getElementById('smsBox').style.display = 'block';
    document.getElementById('smsMsg').textContent = '📱 Код: ' + code;
}
function verifySMS() {
    var ph = document.getElementById('phone').value.replace(/\D/g,'');
    var code = document.getElementById('smsInput').value.trim();
    if (db.sms[ph] === code) {
        var found = null;
        for (var i=0;i<db.users.length;i++) {
            if (db.users[i].phone === ph) found = db.users[i];
        }
        if (!found) {
            found = { id:'u'+Date.now(), name:'Пользователь', username:'@user'+ph.slice(-4), password:'', role:'user', status:'basic', verified:false, emoji:'👤', phone:ph };
            db.users.push(found);
            save();
        }
        me = found;
        localStorage.setItem('dme', JSON.stringify(me));
        showMain();
    } else { alert('Неверный код'); }
}
function loginWithCode() {
    var code = document.getElementById('accessCode').value.trim();
    var user = document.getElementById('loginUser').value.trim();
    if (!code || !user) { document.getElementById('loginErr').textContent = 'Заполните оба поля'; return; }
    var found = null;
    for (var i=0;i<db.users.length;i++) {
        var u = db.users[i];
        if (u.username === user && (u.password === code || db.code === code)) found = u;
    }
    if (!found) { document.getElementById('loginErr').textContent =
